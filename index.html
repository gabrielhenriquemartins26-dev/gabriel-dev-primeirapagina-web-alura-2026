<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog esportivo</title>
    <link rel="stylesheet" href="style.css"> 
    
</head>

<body>
    <header>
        <h1>Meu blog esportivo</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação.</p>
        <img src="imagem-blog.png" alt="Logotipo conceitual de futebol.">
    </header>

    <main>
        <h2>Meu primeiro post</h2>
        <p>Por: Gabriel Martins</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de futebol e curiosidades da área de esporte.</p>

        <div>
            <button>❤️<span>0</span></button>
            <button>👍<span>0</span></button>
            <button>👎<span>0</span></button>
            <button>😂<span>0</span></button>
        </div>
    </main>

    <script>
        let botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            let curtiu = false;

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                console.log("fui clicado");

                let texto = botao.querySelector("span");

                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            }
        });
    </script>

</body>
</html>
